name: SyncMe 1.1.1 Build 256 — minor fixes, verified APK and public release
on:
  push:
    branches: [syncme-256-minor-fixes]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: syncme-minor-fixes-${{ github.ref }}
  cancel-in-progress: true
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
  SYNCME_BUILD_NUMBER: '256'
  SYNCME_VERSION_CODE: '20261023'
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: false
      - name: Record release rules
        run: cat docs/syncme/build-256-minor-fixes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify OAuth metadata and default server configuration
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          from urllib.parse import urlparse
          config = Path('plugins/src/main/kotlin/config/BuildTimeConfig.kt').read_text()
          scheme = re.search(r'METADATA_HOST_REVERSED: String\? = "([^\"]+)"', config)[1]
          website = re.search(r'URL_WEBSITE: String\? = "([^\"]+)"', config)[1]
          assert website == 'https://github.com/DrEsmaily/SyncMe'
          host = urlparse(website).hostname
          assert scheme.split('.')[:len(host.split('.'))] == host.split('.')[::-1]
          assert 'OAUTH_CLIENT_URL_PATH: String? = null' in config
          assert 'APPLICATION_ID = "ir.syncme.app"' in config
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assert '@string/login_redirect_scheme' in manifest
          provider = Path('app/src/main/kotlin/io/element/android/x/oidc/DefaultOAuthRedirectUrlProvider.kt').read_text()
          assert 'R.string.login_redirect_scheme' in provider
          for root in ('app', 'features', 'libraries', 'plugins'):
              for path in Path(root).rglob('*'):
                  if path.is_file() and path.suffix in ('.kt', '.kts', '.xml', '.json', '.properties'):
                      assert '.'.join(('syncme', 'ir')) not in path.read_text(errors='replace').lower(), str(path)
          PYTHON
      - name: Preserve the existing SyncMe application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          source = p.read_text()
          marker = 'getByName("release") {'
          assert source.count(marker) == 1
          p.write_text(source.replace(marker, marker + '\n            applicationIdSuffix = ".syncmerelease"'))
          PY
      - name: Run presence, UI presenters, TLS, reset and Firebase regressions
        run: >-
          ./gradlew
          :features:preferences:impl:testDebugUnitTest --tests '*VersionFormatterTest' --tests '*PreferencesRootPresenterTest*developer settings*' --tests '*PreferencesRootViewTest*About*' --tests '*PreferencesRootViewTest*Developer settings*' --tests '*PreferencesRootViewTest*version sends*'
          :features:login:impl:testDebugUnitTest --tests '*ConfirmAccountProviderPresenterTest' --tests '*AccountProviderDataSourceTest'
          :appnav:testDebugUnitTest --tests '*RootFlowNodeTest'
          :libraries:matrix:api:testDebugUnitTest --tests '*UserPresenceTest' --tests '*OnlineMemberCountTest'
          :libraries:matrix:impl:testDebugUnitTest --tests '*OAuthConfigurationProviderTest' --tests '*Presence*Test' --tests '*DecryptionDiagnosticsTest' --tests '*UtdTrackerTest'
          :features:roomdetails:impl:testDebugUnitTest --tests '*RoomMemberList*Test' --tests '*RoomDetailsPresenterTest'
          :features:home:impl:testDebugUnitTest --tests '*RoomListPresenterTest' --tests '*RoomListRoomSummaryFactoryTest'
          :features:userprofile:impl:testDebugUnitTest --tests '*UserProfilePresenterTest'
          :features:messages:impl:testDebugUnitTest --tests '*TimelineViewTest' --tests '*TimelinePresenterTest' --tests '*OutgoingReadReceiptsTest' --tests '*TimelineItemsFactoryTest'
          :libraries:rustls-tls:testDebugUnitTest
          :features:securebackup:impl:testDebugUnitTest --tests '*ResetIdentity*Test'
          :libraries:pushproviders:firebase:testDebugUnitTest
          --no-configuration-cache --stacktrace
      - name: Build the checked source
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=true -x lintVitalGplayRelease --no-configuration-cache --stacktrace
      - name: Verify and package the actual APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p build-checkpoint
          apk=build-checkpoint/SyncMe-256-ARM64.apk
          cp "${apks[0]}" "$apk"
          unzip -t "$apk" > build-checkpoint/apk-zip-validation.txt
          aapt_bin="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$aapt_bin" dump badging "$apk" > build-checkpoint/manifest.txt
          grep '^package:' build-checkpoint/manifest.txt | grep -F "versionName='256'" | grep -F "versionCode='202610232'"
          grep '^package:' build-checkpoint/manifest.txt | grep -F '.syncmerelease'
          grep '^native-code:' build-checkpoint/manifest.txt | grep -F 'arm64-v8a'
          "$aapt_bin" dump --values resources "$apk" > build-checkpoint/resources.txt
          grep -F '"com.github.dresmaily.syncme"' build-checkpoint/resources.txt
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, zipfile
          tool = sorted(pathlib.Path(os.environ['ANDROID_HOME']).glob('build-tools/*/dexdump'))[-1]
          found = False
          with zipfile.ZipFile('build-checkpoint/SyncMe-256-ARM64.apk') as apk, tempfile.TemporaryDirectory() as tmp:
              for name in apk.namelist():
                  if name.startswith('classes') and name.endswith('.dex'):
                      dex = pathlib.Path(tmp) / name
                      dex.write_bytes(apk.read(name))
                      output = subprocess.check_output([str(tool), '-f', str(dex)]).decode('utf-8', errors='replace')
                      descriptor = "Lorg/rustls/platformverifier/CertificateVerifier;"
                      if descriptor in output:
                          found = True
          assert found, 'JNI verifier class missing from optimized APK'
          PY
          sha256sum "$apk" > build-checkpoint/SHA256.txt
          cp docs/syncme/presence-review.md build-checkpoint/Review.md
          cp -R docs/syncme build-checkpoint/Documentation
          cp docs/syncme/build-256-minor-fixes.md build-checkpoint/SyncMe-256-Notes.md
          cp .github/SYNCME_CONTINUATION_MASTER.txt build-checkpoint/Original-Continuation-Master.txt
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Device runtime confirmation: not performed"
            cat build-checkpoint/SHA256.txt
          } | tee build-checkpoint/Provenance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate and exact provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-256-ARM64
          path: build-checkpoint/
          if-no-files-found: error
          retention-days: 90
      - name: Upload regression results even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-256-test-results
          path: |
            features/preferences/impl/build/reports/tests/
            features/login/impl/build/reports/tests/
            appnav/build/reports/tests/
            libraries/matrix/api/build/reports/tests/
            libraries/matrix/impl/build/reports/tests/
            features/roomdetails/impl/build/reports/tests/
            features/userprofile/impl/build/reports/tests/
            features/home/impl/build/reports/tests/
            features/messages/impl/build/reports/tests/
            libraries/rustls-tls/build/reports/tests/
            libraries/pushproviders/firebase/build/reports/tests/
            features/securebackup/impl/build/reports/tests/
          if-no-files-found: warn

      - name: Preserve documentation even if compilation fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-256-Cumulative-Documentation
          path: docs/syncme/
          if-no-files-found: error
          retention-days: 90
      - name: Publish the verified APK as a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.1-build256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SyncMe 1.1.1 — Build 256" --latest \
            --notes-file docs/syncme/build-256-minor-fixes.md \
            build-checkpoint/SyncMe-256-ARM64.apk \
            build-checkpoint/SHA256.txt \
            build-checkpoint/Provenance.txt \
            build-checkpoint/manifest.txt \
            build-checkpoint/SyncMe-256-Notes.md
