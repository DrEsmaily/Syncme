name: Correct English release documentation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: syncme-release-documentation-correction
  cancel-in-progress: false
jobs:
  correct-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Correct documentation assets without changing APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import io,json,os,re,subprocess,urllib.request,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          root=Path('corrected-notes');root.mkdir()
          def api(endpoint,data=None):
           cmd=['gh','api',f'repos/{repo}/{endpoint}']
           if data is not None:
            p=root/'request.json';p.write_text(json.dumps(data));cmd+=['--method','PATCH','--input',str(p)]
           return json.loads(subprocess.check_output(cmd))
          def clean(data):
           s=data.decode('utf-8')
           s=re.sub(re.escape('.'.join(('syncme', 'ir'))),'[redacted server address]',s,flags=re.I)
           return s.replace('\u0631\u0641\u0639 \u062e\u0637\u0627\u06cc \u0645\u0634\u06a9\u0644\u0627\u062a \u06a9\u0648\u0686\u06a9','Minor bugs fixed').encode()
          releases=api('releases')
          assert {x['tag_name'] for x in releases}=={'v1.0.0-build254','v1.1.0-build255','v1.1.1-build256'}
          apks={a['id']:(a['name'],a['size'],a.get('digest')) for r in releases for a in r['assets'] if a['name'].endswith('.apk')}
          for release in releases:
           for asset in release['assets']:
            name=asset['name']
            if not name.endswith(('.md','.zip')):continue
            with urllib.request.urlopen(asset['browser_download_url'],timeout=60) as response:data=response.read()
            if name.endswith('.zip'):
             out=io.BytesIO()
             with zipfile.ZipFile(io.BytesIO(data)) as src,zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
               raw=src.read(info.filename)
               assert not info.filename.lower().endswith('.apk'),'Documentation archive unexpectedly contains an APK'
               try:fixed=clean(raw)
               except UnicodeDecodeError:
                assert '.'.join(('syncme', 'ir')).encode() not in raw.lower(),'Unexpected binary address reference'
                fixed=raw
               dst.writestr(info,fixed)
              dst.writestr("Documentation-Redactions.txt", 'Current documentation snapshots redact a retired server address. Original Git history and APK files are unchanged. Historical checksums describe the original captured files, not the redacted documentation copies.\n')
             changed=out.getvalue()
             # Only replace archives whose contents actually require correction.
             with zipfile.ZipFile(io.BytesIO(data)) as src,zipfile.ZipFile(io.BytesIO(changed)) as dst:
              needs_update=set(src.namelist()) != set(dst.namelist()) or any(src.read(n)!=dst.read(n) for n in src.namelist())
            else:
             changed=clean(data);needs_update=changed!=data
            if not needs_update:continue
            staged=root/(name+'.corrected-'+os.environ['GITHUB_RUN_ID'])
            staged.write_bytes(changed)
            subprocess.run(['gh','release','upload',release['tag_name'],str(staged),'--repo',repo],check=True)
            refreshed=api('releases/'+str(release['id']))
            uploaded=next(a for a in refreshed['assets'] if a['name']==staged.name)
            assert uploaded['size']==len(changed)
            # Upload the replacement successfully before removing the old notes asset.
            subprocess.run(['gh','api',f'repos/{repo}/releases/assets/{asset["id"]}','--method','DELETE'],check=True)
            api('releases/assets/'+str(uploaded['id']),{'name':name})
            print('Corrected:',release['tag_name'],name)
           body='Minor bugs fixed' if release['tag_name']=='v1.1.1-build256' else clean(release['body'].encode()).decode()
           if body!=release['body']:api('releases/'+str(release['id']),{'body':body})
          after=api('releases')
          assert apks=={a['id']:(a['name'],a['size'],a.get('digest')) for r in after for a in r['assets'] if a['name'].endswith('.apk')}
          assert len(after)==3
          print('Release APK identities unchanged; three distinct releases preserved.')
          PYTHON
