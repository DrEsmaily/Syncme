name: SyncMe Local TLS verifier experiment
on:
  push:
    branches: [syncme-234-local-tls-no-crl-experiment-20261010]
    paths:
      - '.github/workflows/syncme-local-tls-experiment.yml'
      - 'app/src/main/kotlin/io/element/android/x/NetworkDiagnostics.kt'
      - 'app/src/main/kotlin/io/element/android/x/ElementXApplication.kt'
      - 'libraries/matrix/impl/src/main/kotlin/io/element/android/libraries/matrix/impl/sync/RustSyncService.kt'
      - 'libraries/matrix/impl/src/main/kotlin/io/element/android/libraries/matrix/impl/RustMatrixClient.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Obtain Android verifier Kotlin sources
        run: |
          git clone --depth 1 https://github.com/rustls/rustls-platform-verifier.git /tmp/syncme-verifier
          cd /tmp/syncme-verifier
          git checkout 8becdc1beaee80afee396a8c769d42fe9bd9cb4e
      - name: Keep chain validation but bypass online revocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/syncme-verifier/android/rustls-platform-verifier/src/main/java/org/rustls/platformverifier/CertificateVerifier.kt")
          s=p.read_text()
          anchor="    @JvmStatic"
          assert s.count(anchor)>=1
          helper="""    private fun syncMeTlsTrace(event: String) {
                  try {
                      val trace = Class.forName("io.element.android.libraries.matrix.api.diagnostics.StartupTrace")
                      val instance = trace.getField("INSTANCE").get(null)
                      trace.getMethod("mark", String::class.java).invoke(instance, event)
                  } catch (_: Exception) {
                      // Diagnostics must never interfere with TLS validation.
                  }
              }
          
          """
          function_marker="    private fun verifyCertificateChain("
          assert s.count(function_marker)==1
          s=s.replace(function_marker,helper+function_marker)
          begin="""        val validChain = try {
                      trustManager.checkServerTrusted"""
          assert s.count(begin)==1
          replacement="""        syncMeTlsTrace("tls_host_" + serverName)\n        syncMeTlsTrace("tls_verify_" + (if (serverName == "syncme.ir" || serverName.endsWith(".syncme.ir")) "firstparty" else "other_host"))
                  syncMeTlsTrace("tls_verify_thread_" + (if (android.os.Looper.myLooper() == android.os.Looper.getMainLooper()) "main" else "background"))
                  syncMeTlsTrace("tls_chain_validation_begin")
                  val validChain = try {
                      trustManager.checkServerTrusted"""
          s=s.replace(begin,replacement)
          rejection="            return VerificationResult(StatusCode.UnknownCert, e.toString())"
          assert s.count(rejection)==1
          s=s.replace(rejection,'            syncMeTlsTrace("tls_chain_rejected")\n'+rejection)
          marker="        // TEST ONLY: Mock test suite cannot attempt to check revocation status"
          assert s.count(marker)==1
          s=s.replace(marker,'''        syncMeTlsTrace("tls_chain_valid_revocation_offline_skipped")
                  // SyncMe: Android platform trust chain checked; never query OCSP / CRL.
                  return VerificationResult(StatusCode.Ok)
          
          '''+marker)
          p.write_text(s)
          
          PY
      - name: Preserve JNI entrypoint and result fields
        run: |
          cat >> /tmp/syncme-verifier/android/rustls-platform-verifier/proguard-rules.pro <<'EOF'
          -keep class org.rustls.platformverifier.CertificateVerifier { *; }
          -keep class org.rustls.platformverifier.VerificationResult { *; }
          -keep class org.rustls.platformverifier.StatusCode { *; }
          EOF
      - name: Enforce fail-closed handling of Android trust verifier errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/syncme-verifier/android/rustls-platform-verifier/src/main/java/org/rustls/platformverifier/CertificateVerifier.kt")
          s=p.read_text()
          anchor='''            syncMeTlsTrace("tls_chain_rejected")
                      return VerificationResult(StatusCode.UnknownCert, e.toString())
                  }'''
          assert s.count(anchor)==1, "Expected catch block not found"
          replacement='''            syncMeTlsTrace("tls_chain_rejected")
                      return VerificationResult(StatusCode.UnknownCert, e.toString())
                  } catch (e: RuntimeException) {
                      android.util.Log.e(TAG, "Android trust verification runtime failure", e)
                      return VerificationResult(StatusCode.Unavailable, "Android trust verifier unavailable")
                  }'''
          s=s.replace(anchor,replacement)
          p.write_text(s)
          PY
      - name: Build patched verifier AAR
        run: |
          cd /tmp/syncme-verifier/android
          chmod +x gradlew
          ./gradlew :rustls-platform-verifier:assembleDebug --no-daemon
      - name: Override exact Maven Android verifier package on runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          aar=Path("/tmp/syncme-verifier/android/rustls-platform-verifier/build/outputs/aar/rustls-platform-verifier-debug.aar")
          assert aar.exists(), "Patched AAR missing"
          target=Path("offline-maven/org/rustls/rustls-platform-verifier/0.2.0")
          target.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(aar,target/"rustls-platform-verifier-0.2.0.aar")
          (target/"rustls-platform-verifier-0.2.0.pom").write_text('<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>org.rustls</groupId><artifactId>rustls-platform-verifier</artifactId><version>0.2.0</version><packaging>aar</packaging></project>')
          p=Path("settings.gradle.kts")
          s=p.read_text()
          old='url = uri("https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/")'
          assert s.count(old)==1
          s=s.replace(old,'url = uri(file("offline-maven"))')
          p.write_text(s)
          PY
      - name: Verify patched verifier is selected for app runtime
        run: |
          ./gradlew :app:dependencyInsight --configuration gplayReleaseRuntimeClasspath --dependency rustls-platform-verifier --no-daemon > /tmp/syncme-dependency-insight.txt
          cat /tmp/syncme-dependency-insight.txt
          grep -q 'org.rustls:rustls-platform-verifier:0.2.0' /tmp/syncme-dependency-insight.txt || { echo 'ERROR: Patched verifier not selected'; exit 1; }
      - name: Keep JNI entrypoint in app
        run: |
          mkdir -p app/proguard/common
          printf '%s\n' '-keep class org.rustls.platformverifier.CertificateVerifier { *; }' '-keep class org.rustls.platformverifier.VerificationResult { *; }' '-keep class org.rustls.platformverifier.StatusCode { *; }' > app/proguard/common/syncme-rustls-jni.pro
      - name: Build app ARM64 parity settings
        run: |
          sed -i '/optimization {/{n;s/enable = true/enable = false/;}' app/build.gradle.kts
          ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=false -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - name: Validate verifier class and offline revocation patch in APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob, subprocess, zipfile, hashlib
          aar=Path("/tmp/syncme-verifier/android/rustls-platform-verifier/build/outputs/aar/rustls-platform-verifier-debug.aar")
          assert aar.exists()
          with zipfile.ZipFile(aar) as z:
              jar=z.read("classes.jar")
          Path("/tmp/syncme-verifier-classes.jar").write_bytes(jar)
          out=subprocess.check_output(["javap","-p","-classpath","/tmp/syncme-verifier-classes.jar","org.rustls.platformverifier.CertificateVerifier"],text=True)
          assert "verifyCertificateChain" in out, out
          for cls in ["org.rustls.platformverifier.VerificationResult","org.rustls.platformverifier.StatusCode"]:
              subprocess.check_call(["javap","-p","-classpath","/tmp/syncme-verifier-classes.jar",cls],stdout=subprocess.DEVNULL)
          apk=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert apk
          sdk=Path(__import__("os").environ["ANDROID_HOME"])/"build-tools"
          tool=sorted(sdk.glob("*/dexdump"))[-1]
          with zipfile.ZipFile(apk[0]) as z:
              dexfiles=[n for n in z.namelist() if n.startswith("classes") and n.endswith(".dex")]
              found=False
              for n in dexfiles:
                  dex=Path("/tmp")/n
                  dex.write_bytes(z.read(n))
                  p=subprocess.run([str(tool),"-f",str(dex)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
                  output=p.stdout.decode("utf-8",errors="replace")
                  if "Lorg/rustls/platformverifier/CertificateVerifier;" in output:
                      found=True
                      assert "verifyCertificateChain" in output
                      break
              assert found, "JNI CertificateVerifier missing from packaged APK DEX"
          source=Path("/tmp/syncme-verifier/android/rustls-platform-verifier/src/main/java/org/rustls/platformverifier/CertificateVerifier.kt").read_text()
          assert 'syncMeTlsTrace("tls_chain_valid_revocation_offline_skipped")' in source
          assert "trustManager.checkServerTrusted" in source
          print("PASS: patched AAR class, JNI method and packaged APK DEX found; offline revocation source patch present")
          PY
      - name: Verify contents and publish diagnostic artifact
        run: |
          python3 - <<'PY'
          import glob,zipfile
          a=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert a
          for p in a:
              with zipfile.ZipFile(p) as z:
                  so=[x for x in z.infolist() if x.filename.endswith(".so")]
                  assert so and all(x.compress_type==0 for x in so)
                  found=[x.filename for x in z.infolist() if x.filename.startswith("classes") and x.filename.endswith(".dex")]
                  assert found
                  print("Verified APK",p,"native libraries",len(so))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SyncMe-localTLS-no-CRL-ARM64-EXPERIMENTAL
          path: |
            app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
            LOCAL_ONLY_TLS_REQUIREMENTS.md
          if-no-files-found: error
