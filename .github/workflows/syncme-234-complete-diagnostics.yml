name: SyncMe 234 Complete Diagnostics ARM64 APK

on:
  push:
    branches:
      - syncme-234-diagnostics-complete-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncme-234-complete-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build isolated SyncMe 234 ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Confirm SSL bypass is configured on both client stacks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'return ClientBuilder().disableSslVerification()' libraries/matrix/impl/src/main/kotlin/io/element/android/libraries/matrix/impl/ClientBuilderProvider.kt
          grep -F 'sslSocketFactory(sslContext.socketFactory, permissiveTrustManager)' libraries/network/src/main/kotlin/io/element/android/libraries/network/di/NetworkBindingContainer.kt
          grep -F 'hostnameVerifier { hostname, _ ->' libraries/network/src/main/kotlin/io/element/android/libraries/network/di/NetworkBindingContainer.kt
          grep -F '26.10.05-nightly' gradle/libs.versions.toml
          grep -F 'object TlsAudit' libraries/matrix/api/src/main/kotlin/io/element/android/libraries/matrix/api/diagnostics/TlsAudit.kt
          grep -F 'TlsAudit.initialize(this)' app/src/main/kotlin/io/element/android/x/ElementXApplication.kt
          grep -F 'eventListenerFactory' libraries/network/src/main/kotlin/io/element/android/libraries/network/di/NetworkBindingContainer.kt
          grep -F 'SSL / TLS audit log' features/preferences/impl/src/main/kotlin/io/element/android/features/preferences/impl/developer/DeveloperSettingsView.kt
          grep -F 'private fun exportTlsAudit()' app/src/main/kotlin/io/element/android/x/MainActivity.kt
          grep -F 'Startup diagnostics' features/preferences/impl/src/main/kotlin/io/element/android/features/preferences/impl/developer/DeveloperSettingsView.kt
          if grep -Fq 'View startup diagnostics' features/preferences/impl/src/main/kotlin/io/element/android/features/preferences/impl/root/PreferencesRootView.kt; then
            echo "Old startup diagnostics menu item is still present" >&2
            exit 1
          fi
          grep -F 'RUST_NATIVE_NETWORK_TRACING' libraries/matrix/api/src/main/kotlin/io/element/android/libraries/matrix/api/diagnostics/TlsAudit.kt
          grep -F 'auditTargets' app/src/main/kotlin/io/element/android/x/initializer/PlatformInitializer.kt
          git diff --check

      - name: Set separate Android application ID
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'getByName("release") {' app/build.gradle.kts)" -eq 1
          sed -i '/getByName("release") {/a\            applicationIdSuffix = ".syncmerelease"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".syncmerelease"' app/build.gradle.kts

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build optimized ARM64 APK with TLS diagnostics
        env:
          SYNCME_BUILD_NUMBER: 234
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=true -x lintVitalGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Verify output APK and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk)
          test "${#apks[@]}" -ge 1
          for apk in "${apks[@]}"; do
            ls -lh "$apk"
            sha256sum "$apk"
            unzip -t "$apk" | tail -1
          done
          mkdir -p build-checkpoint
          notes="build-checkpoint/SYNCME-234-BUILD-NOTES-${GITHUB_RUN_ID}.md"
          cat .github/SYNCME_BUILD_NOTES_234.md > "$notes"
          {
            echo
            echo '## Build-specific provenance and results'
            echo
            echo "- UTC date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- GitHub run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Build: :app:assembleGplayRelease / ARM64 / JDK 21"
            echo "- CI result: compile complete and APK structure validated"
            echo "- Runtime test result: NOT TESTED ON ANDROID IN THIS WORKFLOW"
            echo
            echo '### APK output sizes and SHA-256 checksums'
            echo
            for apk in "${apks[@]}"; do
              echo "- ${apk}"
              sha256sum "$apk"
              ls -lh "$apk"
            done
            echo
            echo '### Recent source commits'
            echo
            git log -n 15 --format='- %h %s'
            echo
            echo '### Explicit caution'
            echo
            echo 'A green GitHub build is not proof of secure TLS or absence of external connections.'
          } >> "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experimental APK and checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-234-COMPLETE-DIAGNOSTICS-ARM64
          if-no-files-found: error
          retention-days: 90
          path: |
            app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
            build-checkpoint/SYNCME-234-BUILD-NOTES-*.md
