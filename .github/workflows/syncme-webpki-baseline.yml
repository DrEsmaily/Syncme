name: SyncMe WebPKI Baseline APK

on:
  push:
    branches:
      - syncme-webpki
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncme-webpki-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Unmodified v26.06.3 GPlay debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx3g
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Check out exact experimental branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
      - name: Verify untouched baseline SDK
        run: |
          grep -F 'matrix_sdk = "org.matrix.rustcomponents:sdk-android:26.06.11"' gradle/libs.versions.toml
          git rev-parse HEAD
      - name: Build Android GPlay debug APK
        run: ./gradlew :app:assembleGplayDebug --stacktrace --no-daemon --no-configuration-cache
      - name: Upload universal debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elementx-v26_06_3-webpki-debug
          path: app/build/outputs/apk/gplay/debug/*-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
